<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FleetAutomate app icon</title>
  <desc id="desc">A Fluent-style automation flow icon with connected nodes, cursor pointer, and execution spark.</desc>
  <defs>
    <linearGradient id="backgroundGradient" x1="42" y1="26" x2="218" y2="234" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#27C4F4"/>
      <stop offset="0.52" stop-color="#1477D4"/>
      <stop offset="1" stop-color="#0B3F91"/>
    </linearGradient>
    <linearGradient id="nodeGradient" x1="70" y1="65" x2="180" y2="170" gradientUnits="userSpaceOnUse">
